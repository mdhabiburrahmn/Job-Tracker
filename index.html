<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <title>Job Tracker</title>
</head>
<body class="bg-[#F8FAFC]">

    <header class="main-header w-[90%] mx-auto ">
        <h1 
        class=" text-[#002C5C] text-4xl font-bold ">
        Job Application Tracker
        </h1>

        <div 
        class="menu-dives grid grid-cols-3 gap-8 mt-8">
            <div 
            class="bg-white p-4 border-0 rounded-md">
                <P 
                 class="total-count text-[#323B49] ">
                Total
                </P>
                <p 
                class="total text-[#002C5C] text-3xl">
                    0
                </p>
            </div>
            <div 
            class="bg-white p-4 border-0 rounded-md">
                <P 
                class="totalInterview text-[#323B49]">
                    Interview
                </P>
                <p 
                class="interviw text-[#10B981] text-3xl">
                    0
                </p>
            </div>
            <div 
            class="bg-white p-4 border-0 rounded-md">
                <P 
                 class="totalReject text-[#323B49]">
                    Reject
                </P>
                <p 
                class="reject text-[#EF4444] text-3xl">
                    0
                </p>
            </div>
        </div>
    </header>
    
</body>
</html>
